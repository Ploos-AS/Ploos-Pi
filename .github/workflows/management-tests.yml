name: Management policy tests
on:
  push:
    paths: ["software/management/**", "docs/engineering/m1-1-management-test-vectors.csv", ".github/workflows/management-tests.yml"]
  pull_request:
    paths: ["software/management/**", "docs/engineering/m1-1-management-test-vectors.csv", ".github/workflows/management-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q software/management
      - name: Unit tests
        run: python -m unittest discover -s software/management -p 'test_*.py' -v
